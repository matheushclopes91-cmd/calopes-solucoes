version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forex-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/forex.db
      - OANDA_MODE=${OANDA_MODE:-practice}
      - OANDA_TOKEN=${OANDA_TOKEN}
      - OANDA_ACCOUNT=${OANDA_ACCOUNT}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - db
    networks:
      - forex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forex-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - forex-network
    restart: unless-stopped

  # PostgreSQL Database (Optional - for production)
  db:
    image: postgres:15-alpine
    container_name: forex-db
    environment:
      - POSTGRES_DB=forex
      - POSTGRES_USER=${DB_USER:-forex}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-forex123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - forex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional - for fast data caching)
  cache:
    image: redis:7-alpine
    container_name: forex-cache
    ports:
      - "6379:6379"
    networks:
      - forex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: forex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - forex-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  forex-network:
    driver: bridge
